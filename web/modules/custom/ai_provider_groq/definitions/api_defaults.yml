chat:
  input:
    description: 'Input provided to the Groq model.'
    type: 'array'
    default:
      - { role: "system", content: "You are a helpful assistant." }
      - { role: "user", content: "Hello!" }
    required: true
  authentication:
    description: 'Groq API Key.'
    type: 'string'
    default: ''
    required: true
  configuration:
    max_tokens:
      label: 'Max Tokens'
      description: 'Maximum number of tokens to generate in the response.'
      type: 'integer'
      default: 1024
      required: false
      constraints:
        min: 1
        max: 32768
    temperature:
      label: 'Temperature'
      description: 'Sampling temperature between 0 and 2. Higher values produce more random output.'
      type: 'float'
      default: 0.7
      required: false
      constraints:
        min: 0
        max: 2
        step: 0.1
    top_p:
      label: 'Top P'
      description: 'Nucleus sampling: consider tokens whose cumulative probability mass reaches top_p.'
      type: 'float'
      default: 1
      required: false
      constraints:
        min: 0
        max: 1
        step: 0.1
